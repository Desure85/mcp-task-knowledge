name: Bulk Smoke

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.markdownlint*'
      - '.github/workflows/markdownlint-autofix.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.markdownlint*'
      - '.github/workflows/markdownlint-autofix.yml'
  workflow_dispatch:

jobs:
  bulk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate §5.3 этапа Y: настоящие сервисы для контрактных прогонов.
    # Postgres — штатный service; MinIO запускается docker run ниже, потому что
    # GitHub Actions services не умеют передавать команду `server /data` образу minio/minio.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_DIR: ${{ github.workspace }}
      DATA_DIR: ${{ github.workspace }}/.data
      CURRENT_PROJECT: mcp
      EMBEDDINGS_MODE: none
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v7

      - name: Checkout service-catalog
        uses: actions/checkout@v7
        with:
          repository: Desure85/service-catalog
          path: service-catalog
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      # mcp-task-knowledge в корне
      - name: Install & build mcp-task-knowledge
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          npm install --no-audit --no-fund
          npm run build

      # TR-06 / gate R8: supply-chain gate. Blocking: one high or critical advisory
      # in the production dependency tree fails this job, so a vulnerable runtime
      # dependency cannot reach master. Moderate and below are reported, not blocking.
      # The registry is pinned to npmjs.org on purpose: .npmrc points at a mirror
      # whose advisory endpoint is not guaranteed to answer.
      # If this step is red, read "Что делать, если npm audit красный" in CONTRIBUTING.md.
      - name: npm audit (production deps, blocks on high or critical)
        run: |
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/

      - name: Run unit tests
        env:
          EMBEDDINGS_MODE: none
        run: |
          npm run test:types --silent
          npm test --silent

      # Gate §5.3 (этап Y): тот же контрактный набор, но против реального PostgreSQL.
      # Последовательно (maxWorkers=1), чтобы storage-postgres и storage-migrate не делили одну БД.
      - name: Storage contracts against real Postgres
        env:
          EMBEDDINGS_MODE: none
          POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/mcp_test
        run: |
          npx vitest run tests/storage-postgres.test.ts tests/storage-migrate.test.ts --maxWorkers=1

      # Gate §5.3 (этап Y): MinIO как настоящий S3-совместимый сервис для blob-контракта.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not start"
          docker logs minio || true
          exit 1

      - name: Blob contract against real MinIO
        env:
          EMBEDDINGS_MODE: none
          BLOB_S3_ENDPOINT: http://127.0.0.1:9000
          BLOB_S3_BUCKET: mcp-test
          BLOB_S3_ACCESS_KEY: minioadmin
          BLOB_S3_SECRET_KEY: minioadmin
          BLOB_S3_REGION: us-east-1
        run: |
          npx vitest run tests/blob-provider.test.ts --maxWorkers=1

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

      - name: Enforce coverage threshold (Q-005)
        env:
          EMBEDDINGS_MODE: none
        run: |
          npm run test:coverage --silent

      - name: Run Obsidian roundtrip smoke
        env:
          EMBEDDINGS_MODE: none
          PROJECT: mcp
        run: |
          node scripts/obsidian_roundtrip.mjs

      - name: Run MCP bulk smoke (tasks, knowledge, aliases)
        run: |
          mkdir -p "$DATA_DIR"
          node scripts/smoke_tasks.mjs
          node scripts/smoke_knowledge.mjs
          node scripts/smoke_tasks_aliases.mjs

      - name: MCP Inspector conformance (DX-23)
        env:
          EMBEDDINGS_MODE: none
        run: |
          npx vitest run tests/e2e-full/mcp-inspector.test.ts

      - name: Executable docs (DX-24)
        run: |
          npm run docs:test

      # service-catalog из внешнего репозитория
      - name: Install & build service-catalog
        working-directory: service-catalog
        run: |
          npm ci
          npm run build

      - name: Start service-catalog and wait for health
        working-directory: service-catalog
        run: |
          nohup node dist/server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || true)
            if [ "$code" = "200" ]; then echo "Service ready"; break; fi
            sleep 1
            if [ "$i" = "30" ]; then echo "Timeout waiting for service-catalog"; cat server.log || true; exit 1; fi
          done

      - name: Run service-catalog smoke
        working-directory: service-catalog
        run: bash scripts/smoke.sh

      - name: Show service-catalog logs on failure
        if: failure()
        working-directory: service-catalog
        run: |
          echo "=== service-catalog logs ==="
          cat server.log || true

      - name: Stop service-catalog
        if: always()
        working-directory: service-catalog
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi