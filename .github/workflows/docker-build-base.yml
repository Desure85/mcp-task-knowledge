name: Docker Build Base Images

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: false
        default: "linux/amd64"
      tag:
        description: "Tag to publish (default: latest)"
        required: false
        default: "latest"
  push:
    branches:
      - master
      - main
    paths:
      - "package.json"
      - "package-lock.json"

jobs:
  detect-changes:
    name: Check if deps changed
    runs-on: ubuntu-latest
    outputs:
      should_rebuild: ${{ steps.check.outputs.should_rebuild }}
    steps:
      - name: Check event
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            # On push: only rebuild if package.json or package-lock.json changed
            # paths filter already handles this, but double-check
            echo "should_rebuild=true" >> "$GITHUB_OUTPUT"
          fi

  build-base:
    name: Build Base ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.should_rebuild == 'true'
    runs-on: ubuntu-latest
    # Proxy toolchain images don't depend on package.json: on push they are reused
    # from GHCR when the tag is already published. The guard below verifies the tag
    # exists instead of skipping blindly, and rebuilds it when it is missing.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Proxy toolchain images (reused on push when already published)
          - name: proxy-node24-bullseye
            target: proxy-node24-bullseye
            image: mcp-node
            image_tag: 24-bullseye
            proxy: true
          - name: proxy-node24-alpine
            target: proxy-node24-alpine
            image: mcp-node
            image_tag: 24-alpine
            proxy: true
          - name: proxy-python311-slim
            target: proxy-python311-slim
            image: mcp-python
            image_tag: 3.11-slim
            proxy: true
          - name: proxy-cuda-12-4-1
            target: proxy-cuda-12-4-1
            image: mcp-cuda
            image_tag: 12.4.1-cudnn-runtime-ubuntu22.04
            proxy: true

          # Base images that consume proxies via BASE_* args
          - name: deps
            target: base-bm25-with-deps
            image: mcp-base-bm25
            proxy: false
          - name: onnx-cpu
            target: base-onnx-cpu-with-models
            image: mcp-base-onnx
            proxy: false
          - name: onnx-gpu
            target: base-onnx-gpu-with-models
            image: mcp-base-onnx-gpu
            proxy: false

          # Catalog-embedded base images (cat)
          - name: deps-cat
            target: base-bm25-with-deps
            image: mcp-base-bm25-cat
            embedCatalog: true
            proxy: false
          - name: onnx-cpu-cat
            target: base-onnx-cpu-with-models
            image: mcp-base-onnx-cat
            embedCatalog: true
            proxy: false
          - name: onnx-gpu-cat
            target: base-onnx-gpu-with-models
            image: mcp-base-onnx-gpu-cat
            embedCatalog: true
            proxy: false
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64' }}
      PUBLISH_TAG: ${{ github.event.inputs.tag || 'latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute base repo owner (lowercase)
        id: names
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "base_repo=ghcr.io/${owner_lc}" >> "$GITHUB_OUTPUT"

      # On push, proxy toolchain images are reused from GHCR instead of being rebuilt.
      # A blind skip is not safe: if the tag was never published, every base job fails
      # with "not found" (incident 2026-10-30..11-05, run 42070606130). So the tag is
      # verified first: present -> skip, missing -> build it, any other failure -> fail
      # loudly instead of going green.
      - name: Check proxy image availability
        id: proxy-check
        if: github.event_name == 'push' && matrix.proxy == true
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.base_repo }}/${{ matrix.image }}:${{ matrix.image_tag }}
        run: |
          set -uo pipefail
          if output=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Proxy image $IMAGE is published; skipping rebuild on push trigger."
          else
            status=$?
            echo "$output"
            if grep -qiE 'not found|manifest unknown|no such manifest|name unknown|404' <<<"$output"; then
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Proxy image $IMAGE is not published yet - building it on this push."
            else
              echo "::error::Cannot verify proxy image $IMAGE (docker buildx imagetools inspect exit ${status})."
              echo "::error::This is not a missing-image result: check GHCR credentials/network, then run the workflow manually via workflow_dispatch."
              exit 1
            fi
          fi

      - name: Build and push base image
        if: steps.proxy-check.outputs.present != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
            SERVICE_CATALOG_GIT=${{ matrix.embedCatalog && 'https://github.com/Desure85/service-catalog.git' || '' }}
            BASE_NODE_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-node:24-bullseye
            BASE_NODE_ALPINE_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-node:24-alpine
            BASE_PY_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-python:3.11-slim
            BASE_CUDA_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-cuda:12.4.1-cudnn-runtime-ubuntu22.04
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.names.outputs.base_repo }}/${{ matrix.image }}:${{ matrix.image_tag || env.PUBLISH_TAG }}
            ${{ steps.names.outputs.base_repo }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.PUBLISH_TAG }}
