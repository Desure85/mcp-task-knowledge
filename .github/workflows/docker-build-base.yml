name: Docker Build Base Images

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: false
        default: "linux/amd64"
      tag:
        description: "Tag to publish (default: latest)"
        required: false
        default: "latest"
  push:
    branches:
      - master
      - main
    paths:
      - "package.json"
      - "package-lock.json"

jobs:
  detect-changes:
    name: Check if deps changed
    runs-on: ubuntu-latest
    outputs:
      should_rebuild: ${{ steps.check.outputs.should_rebuild }}
    steps:
      - name: Check event
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            # On push: only rebuild if package.json or package-lock.json changed
            # paths filter already handles this, but double-check
            echo "should_rebuild=true" >> "$GITHUB_OUTPUT"
          fi

  build-base:
    name: Build Base ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.should_rebuild == 'true'
    runs-on: ubuntu-latest
    # Skip proxy toolchain images on push trigger — they don't depend on package.json
    # and are already published in GHCR. Only rebuild on manual dispatch.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Proxy toolchain images (only on workflow_dispatch)
          - name: proxy-node20-bullseye
            target: proxy-node20-bullseye
            image: mcp-node
            image_tag: 20-bullseye
            proxy: true
          - name: proxy-node20-alpine
            target: proxy-node20-alpine
            image: mcp-node
            image_tag: 20-alpine
            proxy: true
          - name: proxy-python311-slim
            target: proxy-python311-slim
            image: mcp-python
            image_tag: 3.11-slim
            proxy: true
          - name: proxy-cuda-12-4-1
            target: proxy-cuda-12-4-1
            image: mcp-cuda
            image_tag: 12.4.1-cudnn-runtime-ubuntu22.04
            proxy: true

          # Base images that consume proxies via BASE_* args
          - name: deps
            target: base-bm25-with-deps
            image: mcp-base-bm25
            proxy: false
          - name: onnx-cpu
            target: base-onnx-cpu-with-models
            image: mcp-base-onnx
            proxy: false
          - name: onnx-gpu
            target: base-onnx-gpu-with-models
            image: mcp-base-onnx-gpu
            proxy: false

          # Catalog-embedded base images (cat)
          - name: deps-cat
            target: base-bm25-with-deps
            image: mcp-base-bm25-cat
            embedCatalog: true
            proxy: false
          - name: onnx-cpu-cat
            target: base-onnx-cpu-with-models
            image: mcp-base-onnx-cat
            embedCatalog: true
            proxy: false
          - name: onnx-gpu-cat
            target: base-onnx-gpu-with-models
            image: mcp-base-onnx-gpu-cat
            embedCatalog: true
            proxy: false
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64' }}
      PUBLISH_TAG: ${{ github.event.inputs.tag || 'latest' }}

    steps:
      - name: Skip proxy on push trigger
        id: skip-check
        if: github.event_name == 'push' && matrix.proxy == true
        run: |
          echo "Skipping proxy image on push trigger (not dep-dependent)"
          exit 0

      - name: Checkout
        if: steps.skip-check.conclusion != 'success'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.skip-check.conclusion != 'success'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.skip-check.conclusion != 'success'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip-check.conclusion != 'success'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Compute base repo owner (lowercase)
        if: steps.skip-check.conclusion != 'success'
        id: names
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "base_repo=ghcr.io/${owner_lc}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        if: steps.skip-check.conclusion != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
            SERVICE_CATALOG_GIT=${{ matrix.embedCatalog && 'https://github.com/Desure85/service-catalog.git' || '' }}
            BASE_NODE_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-node:20-bullseye
            BASE_NODE_ALPINE_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-node:20-alpine
            BASE_PY_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-python:3.11-slim
            BASE_CUDA_IMAGE=${{ steps.names.outputs.base_repo }}/mcp-cuda:12.4.1-cudnn-runtime-ubuntu22.04
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.names.outputs.base_repo }}/${{ matrix.image }}:${{ matrix.image_tag || env.PUBLISH_TAG }}
            ${{ steps.names.outputs.base_repo }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.PUBLISH_TAG }}
